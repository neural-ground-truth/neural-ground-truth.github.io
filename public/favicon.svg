<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <defs>
        <path id="a-path" d="M50.4 78.5a75.1 75.1 0 0 0-28.5 6.9l24.2-65.7c.7-2 1.9-3.2 3.4-3.2h29c1.5 0 2.7 1.2 3.4 3.2l24.2 65.7s-11.6-7-28.5-7L67 45.5c-.4-1.7-1.6-2.8-2.9-2.8-1.3 0-2.5 1.1-2.9 2.7L50.4 78.5Z" />
        
        <mask id="gap-mask">
            <rect x="0" y="0" width="128" height="128" fill="white" />
            <rect x="74" y="-10" width="23.2" height="150" fill="black" />
        </mask>
    </defs>

    <!-- The masked A shape with rounded corners via CSS stroke -->
    <use href="#a-path" class="a-shape" mask="url(#gap-mask)" />
    
    <!-- The vertical I, perfectly square, height adjusted to 91.6 to maintain perfect horizontal baseline alignment with the newly-thickened rounded A tip (Y=86.6) -->
    <rect x="74.5" y="-5" width="22.2" height="91.6" class="i-line" />
    
    <style>
        .a-shape { 
            fill: #000; 
            stroke: #000;
            stroke-width: 2.4px;
            stroke-linejoin: round;
        }
        .i-line { fill: #4338ca; }
        @media (prefers-color-scheme: dark) {
            .a-shape { 
                fill: #FFF; 
                stroke: #FFF;
            }
            .i-line { fill: #818cf8; }
        }
    </style>
</svg>
